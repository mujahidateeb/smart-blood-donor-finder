<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit blood request</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div th:replace="fragments :: nav"></div><main class="form-wrap"><section class="form-card"><div th:replace="fragments :: alerts"></div><span class="eyebrow">ADMINISTRATION</span><h1>Edit blood request</h1><p class="muted" th:text="'Patient: ' + ${request.patient.fullName} + ' (' + ${request.patient.email} + ')'"></p>
<form th:action="@{'/admin/requests/' + ${request.id}}" th:object="${request}" method="post"><label>Blood group<select th:field="*{bloodGroup}" required><option th:each="group : ${bloodGroups}" th:value="${group}" th:text="${group}"></option></select></label><label>City<input th:field="*{city}" required></label><label>Area<input th:field="*{area}"></label><label>Units required<input type="number" min="1" th:field="*{unitsRequired}" required></label><label>Hospital address<textarea th:field="*{hospitalAddress}" required></textarea></label><label>Message<textarea th:field="*{message}"></textarea></label><label>Needed by<input type="datetime-local" th:field="*{neededBy}"></label><label>Status<select th:field="*{status}" required><option th:each="state : ${statuses}" th:value="${state}" th:text="${state}"></option></select></label><button class="btn primary full">Save request</button></form><p><a href="/admin/requests">← Back to requests</a></p></section></main></body></html>
