<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit user</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div th:replace="fragments :: nav"></div><main class="form-wrap"><section class="form-card"><div th:replace="fragments :: alerts"></div><span class="eyebrow">ADMINISTRATION</span><h1>Edit user</h1><p class="muted" th:text="'Account role: ' + ${user.role}">Account</p>
<form th:action="@{'/admin/users/' + ${user.id}}" th:object="${user}" method="post"><label>Full name<input th:field="*{fullName}" required></label><label>Email<input type="email" th:field="*{email}" required></label><label>Phone<input th:field="*{phone}"></label><label>Blood group<select th:field="*{bloodGroup}"><option value="">Not specified</option><option th:each="group : ${bloodGroups}" th:value="${group}" th:text="${group}"></option></select></label><label>City<input th:field="*{city}"></label><label>Area<input th:field="*{area}"></label><label>Available to donate<select th:field="*{availableToDonate}"><option th:value="true">Yes</option><option th:value="false">No</option></select></label><button class="btn primary full">Save user</button></form><p><a href="/admin/users">← Back to users</a></p></section></main></body></html>
