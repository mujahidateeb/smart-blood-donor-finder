<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div th:replace="fragments :: nav"></div><main class="form-wrap"><section class="form-card"><h1>Welcome back</h1><p class="muted">Sign in to continue to your account.</p><div th:replace="fragments :: alerts"></div>
<form method="post" th:action="@{/login}"><label>Email address</label><input type="email" name="username" required placeholder="you@example.com"><label>Password</label><input type="password" name="password" required placeholder="Your password"><button class="btn primary full">Sign in</button></form>
<p class="muted center">New here? <a href="/register">Create an account</a></p></section></main></body></html>
