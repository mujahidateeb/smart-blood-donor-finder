<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Request details</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div th:replace="fragments :: nav"></div><main class="container narrow"><span class="eyebrow">REQUEST TRACKING</span><h1>Blood request details</h1><div class="detail-card">
<div class="status" th:text="${request.status}"></div><h2 th:text="${request.bloodGroup} + ' blood required'"></h2>
<p><b>Location:</b> <span th:text="${request.city} + ' · ' + ${request.area}"></span></p><p><b>Units:</b> <span th:text="${request.unitsRequired}"></span></p><p><b>Hospital:</b> <span th:text="${request.hospitalAddress}"></span></p><p><b>Message:</b> <span th:text="${request.message}"></span></p>
<div th:if="${request.status.name() == 'ACCEPTED'}" class="contact-panel"><h3>Connection established</h3><p><b>Patient:</b> <span th:text="${request.patient.fullName}"></span></p><p><b>Patient phone:</b> <span th:text="${request.patient.phone}"></span></p><p th:if="${request.acceptedDonor != null}"><b>Donor:</b> <span th:text="${request.acceptedDonor.fullName}"></span> · <span th:text="${request.acceptedDonor.phone}"></span></p><small>Contact details are visible only to the patient and the donor who accepted this request.</small></div>
<form th:if="${request.status.name() == 'ACCEPTED'}" th:action="@{'/requests/' + ${request.id} + '/status}" method="post" class="actions"><button name="status" value="COMPLETED" class="btn primary">Mark completed</button><button name="status" value="CANCELLED" class="btn secondary">Cancel request</button></form>
</div><a href="/dashboard">← Back to dashboard</a></main></body></html>
